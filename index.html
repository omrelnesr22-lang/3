<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>المراجعة النهائية – الكمبيوتر وتكنولوجيا المعلومات – الصف الثالث الإعدادي</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f7fb;--card:#fff;--tx:#1d2b3a;--mut:#64748b;--pri:#2563eb;--ok:#16a34a;--okb:#dcfce7;--no:#dc2626;--nob:#fee2e2;--fl:#b45309;--flb:#fef3c7;--bd:#e2e8f0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f172a;--card:#1e293b;--tx:#e8eef7;--mut:#94a3b8;--pri:#60a5fa;--okb:#14532d;--nob:#7f1d1d;--flb:#78350f;--bd:#334155}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font-family:Cairo,Tahoma,sans-serif;line-height:1.8;min-height:100vh}
.wrap{max-width:760px;margin:0 auto;padding:16px}
.hero{text-align:center;background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff;border-radius:24px;padding:28px 18px;margin-bottom:16px}
.hero h1{margin:4px 0;font-size:1.5rem}.hero p{margin:6px 0}
.dua{background:rgba(255,255,255,.16);border-radius:16px;padding:12px;margin-top:12px;font-weight:600}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:16px;margin:12px 0}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:10px 18px;background:var(--pri);color:#fff;font-weight:600}
button.sec{background:transparent;color:var(--pri);border:1px solid var(--pri)}
button:disabled{opacity:.4;cursor:default}
.unit{color:var(--mut);font-weight:600;margin:18px 0 4px}
.lesson{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.lesson.off{opacity:.55}.tag{font-size:.8rem;color:var(--mut)}
.bar{height:10px;background:var(--bd);border-radius:9px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:var(--pri);transition:width .3s}
.opt{display:block;width:100%;text-align:right;background:var(--card);color:var(--tx);border:2px solid var(--bd);margin:8px 0;padding:12px}
.opt.ok{background:var(--okb);border-color:var(--ok)}.opt.no{background:var(--nob);border-color:var(--no)}
.fb{border-radius:14px;padding:12px;margin-top:10px;animation:in .3s}.fb.ok{background:var(--okb)}.fb.no{background:var(--nob)}.fb.fl{background:var(--flb)}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
code,.code{direction:ltr;unicode-bidi:isolate;font-family:Consolas,monospace}
.code{display:block;text-align:left;background:#0f172a;color:#e2e8f0;border-radius:12px;padding:10px;margin:8px 0;white-space:pre-wrap}
.opt code{display:inline-block}
.nav{display:flex;justify-content:space-between;margin-top:14px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.stats div{background:var(--bg);border-radius:12px;padding:10px;text-align:center}
.big{font-size:2.2rem;font-weight:800;text-align:center}

/* ===== تجاوب شامل: هاتف / تابلت / كمبيوتر ===== */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{font-size:clamp(15px,calc(13px + .5vw),18px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);overflow-x:hidden}
.wrap{width:100%;max-width:820px;padding:clamp(10px,3.2vw,24px)}
.wrap.home{max-width:1080px;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:12px;align-items:stretch}
.wrap.home>.hero,.wrap.home>.unit,.wrap.home>h2{grid-column:1/-1}
.wrap.home>.card{margin:0}
h2{font-size:clamp(1.05rem,2.4vw,1.4rem);margin:.4em 0;grid-column:1/-1}
.hero{padding:clamp(18px,5vw,40px) clamp(12px,4vw,32px);margin-bottom:4px}
.hero h1{font-size:clamp(1.35rem,5vw,2.2rem)}
button{min-height:46px;touch-action:manipulation}
.opt{min-height:52px}
@media(hover:hover){.opt:not(:disabled):hover{border-color:var(--pri);transform:translateY(-1px)}button:not(:disabled):hover{filter:brightness(1.08)}}
:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
.code{overflow-x:auto;max-width:100%;font-size:clamp(.78rem,2.7vw,.95rem)}
.tbl{overflow-x:auto;-webkit-overflow-scrolling:touch}
@media(max-width:560px){.nav{gap:8px}.nav button{flex:1}.lesson button{width:100%}.stats{gap:6px}
 .wrap:not(.home) .card>.nav{position:sticky;bottom:calc(env(safe-area-inset-bottom,0px) + 6px);background:var(--card);padding:8px 0;z-index:5;box-shadow:0 -10px 12px -10px rgba(0,0,0,.25)}}
@media(min-width:900px){.stats{grid-template-columns:repeat(4,1fr)}.wrap:not(.home){max-width:900px}}
@media(max-height:480px) and (orientation:landscape){.hero{padding:10px}.hero h1{font-size:1.2rem}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
/* ===== مختبر الأكواد ===== */
.lab{margin-top:12px;border:1px dashed var(--pri);border-radius:14px;padding:6px 12px;background:var(--bg)}
.lab>summary{cursor:pointer;font-weight:700;min-height:44px;display:flex;align-items:center}
.labcode{padding:8px 0;white-space:pre}
.ln{display:block;padding:0 8px;border-radius:6px;white-space:pre}
.ln i{display:inline-block;width:2em;color:#64748b;font-style:normal;user-select:none}
.ln.on{background:rgba(250,204,21,.28);box-shadow:inset 3px 0 0 #facc15}
.labctl{display:flex;gap:6px;align-items:center;justify-content:center;flex-wrap:wrap;margin:8px 0}
.labctl button{min-width:48px;padding:8px 12px}
.labnote{background:var(--flb);border-radius:12px;padding:8px 12px;margin:6px 0}
.labt{width:100%;border-collapse:collapse;font-size:.85em}
.labt th,.labt td{border-bottom:1px solid var(--bd);padding:4px 6px;text-align:right;vertical-align:top}
.labt tr.cur{background:rgba(37,99,235,.12)}
.chip{display:inline-block;direction:ltr;unicode-bidi:isolate;font-family:Consolas,monospace;background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:0 6px;margin:2px}
.chip.ch{border-color:#f59e0b;background:var(--flb)}
.labout{direction:ltr;text-align:left;background:#0f172a;color:#a7f3d0;border-radius:10px;padding:8px;margin:6px 0;white-space:pre-wrap;min-height:2.4em;font-family:Consolas,monospace}
</style>
</head>

const Q1=[
{t:"أي مما يلي يمثل الخطوة الأولى والأساسية في مهارات التفكير الحاسوبي عند مواجهة مشكلة جديدة؟",o:["التعرف على الأنماط","تحليل المشكلة","التجريد","تصميم الخوارزمية"],a:1,

 w:{0:"التعرف على الأنماط يأتي بعد تقسيم المشكلة.",2:"التجريد يأتي بعد فهم أجزاء المشكلة.",3:"تصميم الخوارزمية هو آخر خطوة."}},
{t:"ما هو المصطلح العلمي في التفكير الحاسوبي الذي يعبر عن التركيز على المعلومات المهمة واستبعاد التفاصيل غير الضرورية؟",o:["الخوارزمية","تحليل المشكلة","التعرف على الأنماط","التجريد"],a:3,
 e:"التجريد (Abstraction) معناه أن نأخذ المعلومات المهمة فقط ونترك التفاصيل التي لا تؤثر في الحل، مثل لون النافذة عند جمع رقمين.",

 e:"الخوارزمية هي خطوات واضحة ومرتبة لحل المشكلة، وكتابتها هي «تصميم الخوارزمية».",

 e:"الدالة int() تفهم الأرقام المكتوبة بالأرقام فقط مثل \"10\". الكلمات مثل «عشرة» لا تستطيع تحويلها، فيظهر خطأ اسمه ValueError (قيمة غير صالحة).",

{t:"في الجمل الشرطية، أي الكلمات المحجوزة تستخدم مع if لتنفيذ كتلة من الأوامر فقط في حال كان الشرط المبدئي غير صحيح؟",o:["for","elif","else","print"],a:2,

   case"def":env.v.set(s.name,{fn:1,name:s.name,params:s.params,body:s.body});rec(s.line,`تعريف الدالة ${s.name} (لم تُنفَّذ بعد، فقط حُفظت)`,env);return;
   case"asg":{const v=ev(s.v,env);if(s.tg.t==="tuple"){s.tg.it.forEach((t,k)=>env.v.set(t.n,v[k]))}else if(s.tg.t==="name")env.v.set(s.tg.n,v);else throw PyErr("SyntaxError","هدف إسناد غير مدعوم");
    rec(s.line,s.tg.t==="tuple"?"إسناد عدة قيم: "+s.src:`${s.tg.n} = ${repr(v)}`,env);return}
   case"aug":{const v=bin(s.op,lookup(s.tg.n,env),ev(s.v,env));env.v.set(s.tg.n,v);rec(s.line,`${s.tg.n} ${s.op}= ... فتصبح قيمته ${repr(v)}`,env);return}
   case"ex":{const n0=T.steps.length;ev(s.e,env);if(T.steps.length===n0)rec(s.line,"تنفيذ: "+s.src,env);return}
   case"pass":rec(s.line,"pass: لا شيء",env);return;
   case"ret":{const v=s.e?ev(s.e,env):null;rec(s.line,`return ← إرجاع القيمة ${repr(v)} إلى مكان الاستدعاء`,env);throw{R:1,val:v}}
   case"brk":rec(s.line,"break: الخروج من الحلقة فورًا",env);throw{B:1};
   case"if":{for(const b of s.br){const c=truthy(ev(b.cond,env));rec(b.line,`الشرط (${b.src}) = ${repr(c)}`,env);if(c){exec(b.body,env);return}}if(s.els){rec(s.els.line,"else: لم يتحقق أي شرط سابق فتُنفَّذ كتلة else",env);exec(s.els.body,env)}return}
   case"for":{let it=ev(s.it,env);if(typeof it==="string")it=it.split("");if(!Array.isArray(it))throw PyErr("TypeError","غير قابل للتكرار");const n=it.length;
    for(let k=0;k<n;k++){env.v.set(s.v,it[k]);rec(s.line,`${s.v} = ${repr(it[k])} (الدورة ${k+1} من ${n})`,env);try{exec(s.body,env)}catch(x){if(x&&x.B===1)break;throw x}}
    if(!n)rec(s.line,"لا توجد عناصر للتكرار",env);return}
   case"while":{for(;;){const c=truthy(ev(s.c,env));rec(s.line,`الشرط (${s.csrc}) = ${repr(c)}`,env);if(!c)break;try{exec(s.body,env)}catch(x){if(x&&x.B===1)break;throw x}}return}
   case"try":{rec(s.line,"try: نجرّب تنفيذ الأوامر التالية",env);
    try{exec(s.b,env)}catch(x){if(x&&x.py){const h=s.hs.find(h=>!h.ty||h.ty===x.py);if(!h)throw x;rec(h.line,`حدث خطأ من نوع ${x.py} ← تُنفَّذ كتلة except`,env);exec(h.body,env)}else throw x}return}
   default:throw PyErr("SyntaxError","أمر غير مدعوم")}}
 try{exec(prog,G)}catch(x){if(x&&x.py){T.err=x;T.steps.push({line:cl,note:`⚠ حدث خطأ ${x.py}: ${x.msg} ← يتوقف البرنامج`,vars:snap(ce).map(([k,v])=>[k,v,false]),out:T.out,frame:ce.label,err:true})}else if(x&&(x.R||x.B)){}else throw x}
 T.out=T.out;return T}
if(typeof module!=="undefined")module.exports={runTrace};

// ---------- واجهة مختبر الأكواد (تظهر بعد تسجيل الإجابة فقط) ----------
const LAB={};
const inpFor=q=>/"hello"/.test(q.t)||/while True/.test(q.code)?["hello","5"]:/"0"/.test(q.t)?["0"]:["abc"];
const labHTML=qi=>`<details class="lab" ontoggle="if(this.open)labInit(${qi})"><summary>🧪 مختبر الأكواد: تتبّع التنفيذ خطوة بخطوة</summary><div id="lab"></div></details>`;
function labInit(qi){const q=LESSONS[S.i].q[qi],inp=/input\(/.test(q.code)?inpFor(q):[];LAB.q=q;LAB.inp=inp;LAB.T=runTrace(q.code,inp);LAB.i=0;labRender()}
function labGo(d){const n=LAB.T.steps.length;LAB.i=d==="f"?0:d==="l"?n-1:Math.max(0,Math.min(n-1,LAB.i+d));labRender()}
function labRender(){const {q,T,i,inp}=LAB,n=T.steps.length,st=T.steps[i],box=document.getElementById("lab");if(!box)return;
 let h=`<div class="tag">محاكاة تعليمية لتتبّع الكود، وليست تشغيلًا حقيقيًا لبايثون.${inp.length?` المُدخلات المفترضة: ${inp.map(x=>"«"+esc(x)+"»").join("، ")}`:""}</div>`;
 if(!n){box.innerHTML=h+`<div class="fb fl">⚠️ تعذّر تتبّع هذا الكود في المحاكي${T.err?": "+esc(T.err.msg):""}. اقرأ الشرح في الأعلى.</div>`;return}
 h+=`<code class="code labcode">${q.code.split("\n").map((x,k)=>`<span class="ln${st.line===k+1?" on":""}"><i>${k+1}</i>${esc(x)||" "}</span>`).join("")}</code>`;
 h+=`<div class="labctl"><button class="sec" aria-label="أول خطوة" onclick="labGo('f')" ${i?"":"disabled"}>⏮</button><button class="sec" aria-label="الخطوة السابقة" onclick="labGo(-1)" ${i?"":"disabled"}>◀ السابق</button><b>${i+1} / ${n}</b><button aria-label="الخطوة التالية" onclick="labGo(1)" ${i<n-1?"":"disabled"}>التالي ▶</button><button class="sec" aria-label="آخر خطوة" onclick="labGo('l')" ${i<n-1?"":"disabled"}>⏭</button></div>`;
 h+=`<div class="labnote"><b>السطر ${st.line}${st.frame!=="البرنامج"?" (داخل الدالة "+esc(st.frame)+")":""}:</b> ${esc(st.note)}</div>`;
 const from=Math.max(0,i-7);let rows="";
 for(let k=from;k<=i;k++){const s=T.steps[k];rows+=`<tr class="${k===i?"cur":""}"><td>${k+1}</td><td>${s.line}</td><td>${esc(s.note)}</td><td>${s.vars.length?s.vars.map(([a,b,c])=>`<span class="chip${c?" ch":""}"><b>${esc(a)}</b> = ${esc(b)}</span>`).join(""):"—"}</td></tr>`}
 h+=`<div class="tbl"><table class="labt"><thead><tr><th>#</th><th>سطر</th><th>ماذا حدث؟</th><th>قيم المتغيرات (الأصفر = تغيّر)</th></tr></thead><tbody>${rows}</tbody></table></div>${from?`<div class="tag">يُعرض آخر ${i-from+1} خطوات فقط.</div>`:""}`;
 h+=`<div class="tag">الناتج على الشاشة حتى هذه الخطوة:</div><pre class="labout">${esc(st.out)||"(لا ناتج بعد)"}</pre>`;
 if(i===n-1)h+=`<div class="fb ${T.err?"no":"ok"}">${T.err?`انتهى التتبّع بخطأ <b>${esc(T.err.py)}</b>: ${esc(T.err.msg)}`:"✅ انتهى التنفيذ. الناتج النهائي ظاهر في الأعلى."}</div>`;
 box.innerHTML=h}
document.addEventListener("keydown",e=>{if(!S||$.classList.contains("home")||(e.target.closest&&e.target.closest("summary,input,textarea")))return;
 const op=[...$.querySelectorAll(".opt")];if(/^[1-4]$/.test(e.key)&&op[+e.key-1]&&!op[+e.key-1].disabled){op[+e.key-1].click();return}
 const bt=r=>[...$.querySelectorAll(".nav button")].find(b=>r.test(b.textContent.trim()));
 if((e.key==="ArrowLeft"||e.key==="Enter")&&e.target.tagName!=="BUTTON"){const b=bt(/^(التالي|عرض النتيجة)$/);if(b){b.click();e.preventDefault()}}
 if(e.key==="ArrowRight"){const b=bt(/^السابق$/);if(b&&!b.disabled)b.click()}});
home();
</script>
